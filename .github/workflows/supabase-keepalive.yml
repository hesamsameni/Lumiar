name: Supabase keepalive

# Supabase free-tier projects are auto-paused after 7 days of inactivity.
# This job writes to the database every 3 days to keep it awake.

on:
  schedule:
    # 06:00 UTC on days 1, 4, 7, ... of the month (~every 3 days).
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret." >&2
            exit 1
          fi
          curl -fsS -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Keepalive ping sent."
